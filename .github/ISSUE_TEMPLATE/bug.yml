name: Bug report
description: Report incorrect CLI, parser, or MCP behavior without private account data
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste cookies, CSRF tokens, private RSS keys, authenticated HTML, Kindle highlight text, comments, reviews, messages, private URLs, or account-specific screenshots.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What concrete result did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error, command shape, and confidence/warning fields.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or MCP tool
      placeholder: goodreads-cli books list or goodreads_books_list
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source mode
      options:
        - Public live read
        - Authenticated live read
        - Sanitized fixture
        - Local route catalog
        - Dry-run plan
        - Live mutation with approved readback
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Use synthetic IDs and reduced, privacy-safe fixtures only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all credentials, private text, private URLs, account identifiers, and raw authenticated captures.
          required: true
