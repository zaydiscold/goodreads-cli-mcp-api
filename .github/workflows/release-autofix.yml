name: Release autofix

on:
  push:
    branches: [release/twitter-ready-20260824]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/twitter-ready-20260824
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix one-shot Response reuse in the concurrency test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cli/test/live.test.ts")
          text = path.read_text()
          marker = 'it("keeps explicit CSRF values request-local across interleaved calls", async () => {'
          start = text.index(marker)
          end = text.index("\n  it(", start + len(marker))
          section = text[start:end]

          old = '''    const fetchMock = vi.fn().mockResolvedValue(
              new Response('{"ok":true}', {
                status: 200,
                headers: { "content-type": "application/json" },
              }),
            );'''
          new = '''    const fetchMock = vi.fn().mockImplementation(() =>
              Promise.resolve(
                new Response('{"ok":true}', {
                  status: 200,
                  headers: { "content-type": "application/json" },
                }),
              ),
            );'''

          if old in section:
              section = section.replace(old, new, 1)
              path.write_text(text[:start] + section + text[end:])
          elif "mockImplementation" not in section:
              raise SystemExit("target concurrency-test block not found")
          PY
      - run: pnpm format
      - name: Commit release fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli mcp scripts
          git commit -m "chore(release): format and stabilize concurrency test"
          git push origin HEAD:release/twitter-ready-20260824
